  <style>

    .tree-root{padding:8px 7px;font-size:12px;font-weight:650}.tree-wrap{padding-bottom:60px}

    .zoom button{min-height:40px;min-width:40px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:15px}
    .zoom button:hover{background:var(--soft)}
    .canvas-chip{min-height:37px;padding:0 10px;color:var(--muted);font-size:12px;white-space:nowrap}.zoom span{min-width:42px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums}
    .empty{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(380px,calc(100% - 40px));padding:22px;border-radius:12px;background:#fff;box-shadow:var(--shadow)}

    .empty-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}.empty > [data-action="import-file"]{padding-left:0;text-decoration:underline;text-underline-offset:3px;color:var(--muted)}
    .panel{min-height:0;display:flex;flex-direction:column;background:#fff}.panel-head{min-height:58px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}
    .panel-head h2{margin:0;font-size:14px}.panel-body{min-height:0;flex:1;overflow:auto;padding:17px}.panel-foot{padding:14px 17px;border-top:1px solid var(--line);display:flex;gap:25px}
    .panel-foot strong{display:block;margin-top:4px;font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
    .inspector-empty{min-height:265px;display:grid;align-content:center;justify-items:center;text-align:center}
    .inspector-empty .symbol{width:54px;height:54px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;color:var(--faint);font-size:24px}

    .review-tabs button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.08)}
    .filters{display:flex;gap:5px;margin:14px 0}.filters button{min-height:40px;padding:0 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--muted);font-size:12px}

    .drawing-select{max-width:min(390px,35vw);min-height:38px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);text-overflow:ellipsis;font-size:13px}
    /* Focus: canvas owns the screen, panels open on demand. */
    .focus{position:relative}.focus>.canvas{position:absolute;inset:0}
    .focus-top{position:absolute;z-index:3;top:15px;left:15px;right:15px;min-height:54px;display:flex;align-items:center;gap:10px;padding:6px 9px;border-radius:11px;background:#fff;box-shadow:var(--shadow)}
    .focus-title{min-width:0;max-width:30vw;display:grid}.focus-title strong,.focus-title small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.focus-title strong{font-size:13px}.focus-title small{color:var(--faint);font-size:11px}

    .focus-sheet .tree-wrap{padding:0 0 70px}.focus .canvas-footer{bottom:72px}

    .drawer-head{min-height:66px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.drawer-head h2{margin:0;font-size:18px}
    .drawer-body{flex:1;min-height:0;overflow:auto;padding:18px}.drawer-foot{padding:16px 18px 24px;border-top:1px solid var(--line)}
    .palette-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;margin:8px 0 18px}

    .glyph{width:36px;height:36px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:16px}

    .message.user{margin-left:auto;background:var(--ink);color:#fff}.message small{display:block;margin-bottom:3px;color:var(--faint);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
    .message.user small{color:#ccc}.menu{position:absolute;z-index:100;right:16px;top:58px;min-width:224px;padding:6px;border-radius:9px;background:#fff;box-shadow:var(--shadow)}
    .menu button{width:100%;min-height:37px;padding:0 9px;border:0;border-radius:5px;background:transparent;text-align:left;color:var(--ink);font-size:13px}.menu button:hover{background:var(--soft)}
    .menu-title{padding:7px 9px;color:var(--faint);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.menu hr{border:0;border-top:1px solid var(--line);margin:5px}

    @media(hover:hover) and (pointer:fine){.btn:hover,.tree-drawing:hover,.tree-level:hover,.tree-device:hover,.issue:hover{transition-duration:150ms}}

    :root{

    function terminalIds(n){
      const defaults=n.type==='transformer'||n.type==='transformer_3w'?['hv','lv']:n.type==='bus'?['w','e']:n.type==='junction'?['n1','n2','n3','n4']:twoEndedTypes.has(n.type)?['a','b']:['a'];
      const used=[...(drawing().sourceConnections||[]).flatMap(c=>[c.from,c.to]).filter(port=>port.equipmentId===n.id).map(port=>port.portId),...drawing().edges.flatMap(([a,b,ports])=>[a===n.id?ports?.fromPort:null,b===n.id?ports?.toPort:null])].filter(Boolean);

    function terminalPosition(n,port){

      let dx=0,dy=-distance;

      else if(port==='e'){dx=distance;dy=0;}
      else if(/^n\d+$/.test(port)){dx=(Number(port.slice(1))-2)*12;dy=-distance;}
      else if(/^s\d+$/.test(port)){dx=(Number(port.slice(1))-2)*12;dy=distance;}
      const angle=(Number(n.rotation)||0)*Math.PI/180;
      return {x:n.x+dx*Math.cos(angle)-dy*Math.sin(angle),y:n.y+dx*Math.sin(angle)+dy*Math.cos(angle)};

    function orthogonalPath(from,to){

Unconnected'}</div>${btn('Connect terminal','connect-terminal','quiet','style="margin:10px 0 16px"')}<div class="field"><label for="node-notes">Notes</label><textarea id="node-notes" data-field="notes" placeholder="Add engineering context">${esc(n.notes)}</textarea></div><div class="note" style="margin-top:12px">ID · ${esc(n.id)}</div><div class="label inspector-section">Live findings</div><div class="note">${esc(findings().find(f=>f.id===n.id)?.text||'No current live finding for this equipment.')}</div>`;

      if(state.tool==='connect')updateConnectionPreview(e);
      if(areaStart){const a=areaStart;a.box.style.left=`${Math.min(a.x,e.clientX)-a.rect.left}px`;a.box.style.top=`${Math.min(a.y,e.clientY)-a.rect.top}px`;a.box.style.width=`${Math.abs(e.clientX-a.x)}px`;a.box.style.height=`${Math.abs(e.clientY-a.y)}px`;return;}
      if(moveStart){const m=moveStart;if(!m.moved&&Math.hypot(e.clientX-m.x,e.clientY-m.y)>3){recordUndo();m.moved=true;}if(m.moved){const rect=stage.querySelector('.diagram').getBoundingClientRect(),scale=Math.min(rect.width/1000,rect.height/620)*state.zoom/100;m.n.x=Math.max(45,Math.min(900,m.nx+(e.clientX-m.x)/scale));m.n.y=Math.max(45,Math.min(570,m.ny+(e.clientY-m.y)/scale));m.element.setAttribute('transform',`translate(${m.n.x} ${m.n.y})`);drawing().edges.forEach(([a,b,ports],i)=>{if(a!==m.n.id&&b!==m.n.id)return;const p=nodes().find(n=>n.id===a),q=nodes().find(n=>n.id===b);if(ports){const route=orthogonalPath(terminalPosition(p,ports.fromPort),terminalPosition(q,ports.toPort));stage.querySelectorAll(`.sld-svg [data-index="${i}"] path`).forEach(path=>path.setAttribute('d',route));}else stage.querySelectorAll(`.sld-svg [data-index="${i}"] line`).forEach(line=>{line.setAttribute('x1',p.x);line.setAttribute('y1',p.y);line.setAttribute('x2',q.x);line.setAttribute('y2',q.y);});});}return;}
      if(!panStart)return;state.panX=panStart.px+e.clientX-panStart.x;state.panY=panStart.py+e.clientY-panStart.y;applyCanvasTransform();
    });
    stage.addEventListener('pointerleave',()=>{lastConnectPointer=null;stage.querySelector('.connection-preview')?.setAttribute('d','');});
    stage.addEventListener('pointerup',e=>{
      if(areaStart){const a=areaStart,scale=Math.min(a.rect.width/1000,a.rect.height/620)*state.zoom/100,minX=Math.min(a.x,e.clientX),maxX=Math.max(a.x,e.clientX),minY=Math.min(a.y,e.clientY),maxY=Math.max(a.y,e.clientY);state.selectedIds=nodes().filter(n=>{const x=a.rect.left+a.rect.width/2+state.panX+(n.x-500)*scale,y=a.rect.top+a.rect.height/2+state.panY+(n.y-310)*scale;return x>=minX&&x<=maxX&&y>=minY&&y<=maxY;}).map(n=>n.id);state.selected=state.selectedIds.at(-1)||null;state.tool='select';state.panel=a.agent?'assistant':state.selected?'properties':null;areaStart=null;suppressCanvasClick=true;setTimeout(()=>suppressCanvasClick=false,0);refresh();return;}
      if(moveStart){const m=moveStart;moveStart=null;if(m.moved){if(state.snap){m.n.x=Math.round(m.n.x/20)*20;m.n.y=Math.round(m.n.y/20)*20;}state.selected=m.n.id;state.selectedIds=[m.n.id];state.panel='properties';suppressCanvasClick=true;setTimeout(()=>suppressCanvasClick=false,0);refresh();}return;}
      panStart=null;
    });
    stage.addEventListener('dblclick',e=>{const item=e.target.closest('svg [data-action=select-node]');if(!item)return;const n=nodes().find(x=>x.id===item.dataset.id);if(!n)return;const rect=stage.querySelector('.diagram').getBoundingClientRect(),scale=Math.min(rect.width/1000,rect.height/620)*state.zoom/100;state.panX=-(n.x-500)*scale;state.panY=-(n.y-310)*scale;state.selected=n.id;state.selectedIds=[n.id];state.panel='properties';refresh();});
    stage.addEventListener('wheel',e=>{
      if(!e.target.closest('.diagram'))return;
      e.preventDefault();
      if(e.ctrlKey||e.metaKey){
        const step=Math.max(-.25,Math.min(.25,-e.deltaY*.01));
        zoomAt(e.clientX,e.clientY,state.zoom*Math.exp(step));
      }else{
        const unit=e.deltaMode===1?16:e.deltaMode===2?innerHeight:1;
        state.panX-=Math.max(-100,Math.min(100,e.deltaX*unit));
        state.panY-=Math.max(-100,Math.min(100,e.deltaY*unit));
        state.autoPanRestore=null;
        applyCanvasTransform();
      }
    },{passive:false});
    let gestureStartZoom=0;
    stage.addEventListener('gesturestart',e=>{if(!e.target.closest('.diagram'))return;e.preventDefault();gestureStartZoom=state.zoom;});
    stage.addEventListener('gesturechange',e=>{if(!gestureStartZoom||!e.target.closest('.diagram'))return;e.preventDefault();zoomAt(e.clientX,e.clientY,gestureStartZoom*e.scale);});
    stage.addEventListener('gestureend',()=>gestureStartZoom=0);
  </script>
</body>
</html>
